name: Quark签到

on:
  schedule:
    - cron: '0 1 * * *'   # 北京时间 09:00 (UTC+1)
    - cron: '0 5 * * *'   # 北京时间 13:00 (UTC+5)
  workflow_dispatch:      # 允许手动触发

jobs:
  check-if-already-signed:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 恢复签到成功记录缓存
        id: cache-success-restore
        uses: actions/cache@v4
        with:
          path: .last_success_date
          key: last-success-marker-${{ github.run_id }}
          restore-keys: |
            last-success-marker-

      - name: 判断是否已签到
        id: check
        run: |
          current_date=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          echo "当前北京时间: $current_date"

          if [ -f .last_success_date ]; then
            last_date=$(cat .last_success_date)
            echo "上次签到日期: $last_date"
            if [ "$last_date" = "$current_date" ]; then
              echo "今天已成功签到，跳过执行。"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "今天尚未签到，继续执行。"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  sign-in:
    needs: check-if-already-signed
    if: needs.check-if-already-signed.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 随机延迟（早上）
        if: github.event.schedule == '0 1 * * *'
        run: |
          delay=$((RANDOM % 300))
          echo "早上签到，延迟 $delay 秒后开始.."
          sleep $delay

      - name: 随机延迟（下午/手动触发）
        if: github.event.schedule == '0 5 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          delay=$((RANDOM % 30))
          echo "下午兜底或手动触发，延迟 $delay 秒后开始.."
          sleep $delay

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests

      - name: 执行签到脚本并捕获输出
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
        run: |
          # 运行 Python 脚本并将输出存储到日志文件
          python checkIn_Quark.py > result.log 2>&1
          
          # 在终端打印，方便直接查看 GitHub Actions 的运行日志
          cat result.log
          
          # 将多行文本安全写入环境变量
          echo "SIGN_RESULT<<EOF" >> $GITHUB_ENV
          cat result.log >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 标记今天签到成功
        if: success()
        run: |
          date_str=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          echo "$date_str" > .last_success_date
          echo "已记录成功签到日期: $date_str"

      - name: 保存成功记录到缓存
        if: success()
        uses: actions/cache@v4
        with:
          path: .last_success_date
          key: last-success-marker-${{ github.run_id }}

      - name: 签到成功推送
        if: success()
        run: |
          # 使用 jq 组装 JSON 避免特殊符号导致 shell 报错
          jq -n \
            --arg token "${{ secrets.WX_PUSHER_APP_TOKEN }}" \
            --arg content "✅ 夸克网盘签到成功\n\n$SIGN_RESULT" \
            --arg uid "${{ secrets.WX_PUSHER_UID }}" \
            '{
              appToken: $token,
              content: $content,
              contentType: 1,
              uids: [$uid]
            }' > wxpusher_payload.json
            
          curl -s -X POST "https://wxpusher.zjiecode.com/api/send/message" \
          -H "Content-Type: application/json" \
          -d @wxpusher_payload.json

      - name: 签到失败推送
        if: failure()
        run: |
          curl -s -X POST "https://wxpusher.zjiecode.com/api/send/message" \
          -H "Content-Type: application/json" \
          -d '{
            "appToken": "${{ secrets.WX_PUSHER_APP_TOKEN }}",
            "content": "❌ 夸克网盘签到执行失败，请手动查看日志",
            "contentType": 1,
            "uids": ["${{ secrets.WX_PUSHER_UID }}"]
          }'

      - name: 清理旧的工作流记录
        uses: Mattraks/delete-workflow-runs@main
        if: always()
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
