name: 夸克网盘每日签到

on:
  schedule:
    - cron: "0 1 * * *" # 北京时间 09:00
    - cron: "0 5 * * *" # 北京时间 13:00，失败兜底
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quark-signin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取北京时间日期
        id: date
        shell: bash
        run: echo "today=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 恢复今日成功标记
        id: cache-success
        uses: actions/cache/restore@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}

      - name: 今日已完成签到
        if: steps.cache-success.outputs.cache-hit == 'true'
        run: echo "今日已全部签到成功，跳过重复执行。"

      - name: 检出代码
        if: steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/checkout@v7

      - name: 随机延迟
        if: steps.cache-success.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            max_delay=10
          else
            max_delay=60
          fi
          delay=$((RANDOM % (max_delay + 1)))
          echo "随机延迟 ${delay} 秒后开始执行。"
          sleep "$delay"

      - name: 设置 Python 环境
        if: steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: steps.cache-success.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: 执行签到脚本
        id: run_script
        if: steps.cache-success.outputs.cache-hit != 'true'
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
        run: |
          python checkIn_Quark.py > result.log 2>&1 || true
          cat result.log
          echo "SIGN_RESULT<<EOF" >> $GITHUB_ENV
          cat result.log >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          # 判断是否存在账号失败
          if grep -qE "HTTP 401|签到失败" result.log; then
            echo "HAS_FAILURE=true" >> $GITHUB_ENV
            exit 1
          else
            echo "HAS_FAILURE=false" >> $GITHUB_ENV
          fi

      - name: 生成今日成功标记（全部账号成功才执行）
        if: success() && steps.cache-success.outputs.cache-hit != 'true' && env.HAS_FAILURE == 'false'
        run: |
          mkdir -p .cache/quark-signin
          echo "${{ steps.date.outputs.today }}" > .cache/quark-signin/success

      - name: 保存今日成功标记（全部账号成功才执行）
        if: success() && steps.cache-success.outputs.cache-hit != 'true' && env.HAS_FAILURE == 'false'
        uses: actions/cache/save@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}

      - name: 准备推送内容文件
        run: |
          echo "$SIGN_RESULT" > push_content.txt

      - name: 签到成功推送
        if: success()
        run: |
          jq -n \
            --rawfile content push_content.txt \
            --arg token "${{ secrets.WX_PUSHER_APP_TOKEN }}" \
            --arg uid "${{ secrets.WX_PUSHER_UID }}" \
            '{
              appToken: $token,
              content: "✅ 夸克网盘签到成功\n" + $content,
              contentType: 1,
              uids: [$uid]
            }' > wxpusher_payload.json

          curl -s -X POST "shturl.cc/H42lpf0Sg6O9yeOpkyiJGff5dchMp77m7lBc" \
          -H "Content-Type: application/json" \
          -d @wxpusher_payload.json

      - name: 签到失败推送
        if: failure()
        run: |
          jq -n \
            --rawfile content push_content.txt \
            --arg token "${{ secrets.WX_PUSHER_APP_TOKEN }}" \
            --arg uid "${{ secrets.WX_PUSHER_UID }}" \
            '{
              appToken: $token,
              content: "❌ 夸克网盘签到执行失败\n日志内容：\n" + $content,
              contentType: 1,
              uids: [$uid]
            }' > wxpusher_payload.json

          curl -s -X POST "shturl.cc/H42lpf0Sg6O9yeOpkyiJGff5dchMp77m7lBc" \
          -H "Content-Type: application/json" \
          -d @wxpusher_payload.json
